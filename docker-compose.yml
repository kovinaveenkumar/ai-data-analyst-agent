# Quick start:
#   docker compose up -d postgres        # database only (run the app locally)
#   docker compose --profile full up --build   # everything: postgres + MCP server + web app
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: analytics
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - ./db/init:/docker-entrypoint-initdb.d:ro
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d analytics"]
      interval: 5s
      retries: 20

  mcp:
    build: .
    command: ["python", "-m", "analyst.mcp_server.server", "--host", "0.0.0.0", "--port", "8000"]
    environment:
      DATABASE_URL: postgresql://analyst_ro:analyst_ro_pw@postgres:5432/analytics
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8000:8000"
    profiles: ["full"]

  app:
    build: .
    env_file: .env
    environment:
      DATABASE_URL: postgresql://analyst_ro:analyst_ro_pw@postgres:5432/analytics
      MCP_MODE: http
      MCP_SERVER_URL: http://mcp:8000/mcp
    depends_on:
      - mcp
    ports:
      - "8501:8501"
    profiles: ["full"]

volumes:
  pgdata:
