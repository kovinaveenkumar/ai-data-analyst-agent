name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: analytics
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-retries 20
    env:
      DATABASE_URL: postgresql://analyst_ro:analyst_ro_pw@localhost:5432/analytics
      MCP_MODE: inprocess
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Load schema, seed data and read-only role
        env:
          PGPASSWORD: postgres
        run: |
          for f in db/init/*.sql; do psql -h localhost -U postgres -d analytics -v ON_ERROR_STOP=1 -q -f "$f"; done
      - name: Tests (no API key needed - agents use a scripted LLM)
        run: python -m pytest -v
